<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مغامرة الشتاء التعليمية</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>*{font-family:Cairo,sans-serif;touch-action:manipulation}body{background:linear-gradient(135deg,#0f172a,#1e293b,#0b132b);color:#fff;min-height:100vh;user-select:none}.glass{background:#1e293fcc;backdrop-filter:blur(16px);border:1px solid #ffffff26;box-shadow:0 8px 32px #0006}.btn{transition:.2s}.btn:hover{transform:translateY(-3px);background:#0284c7}.tile{background:linear-gradient(145deg,#38bdf8,#0284c7);box-shadow:0 4px #0369a1}.slot{border:2px dashed #ffffff4d}.filled{border:2px solid #38bdf8;background:#0ea5e933}#snow{position:fixed;inset:0;pointer-events:none;z-index:1}.content{position:relative;z-index:2}</style>
</head>
<body class="p-3 md:p-6"><canvas id="snow"></canvas><div class="content max-w-4xl mx-auto min-h-[95vh] flex flex-col">
<header class="glass rounded-2xl p-4 flex justify-between items-center"><button onclick="home()" class="flex items-center gap-3 text-right"><span class="text-3xl">❄️</span><span><b class="block text-cyan-300 text-lg">مغامرة الشتاء</b><small class="text-slate-300">المشروع التعليمي التفاعلي</small></span></button><div id="stats" class="hidden items-center gap-3 text-sm font-bold"><span>⭐ النقاط: <b id="score">0</b></span><button onclick="toggleMute()" id="mute">🔊</button></div></header>
<main id="app" class="flex-1"></main><footer class="glass rounded-2xl text-center p-3 mt-4 text-xs text-slate-400">مغامرة الشتاء التعليمية - صُنع بواسطة: يوسف ، محمد ، تاليا بيلا ، كادي ❄️</footer></div>
<script>
const data=[['معطف','clothes','🧥','نرتديه في الشتاء للتدفئة',['م','ع','ط','ف']],['وشاح','clothes','🧣','نلفه حول الرقبة في الأيام الباردة',['و','ش','ا','ح']],['قفازات','clothes','🧤','نرتديها في اليدين لدفئهما',['ق','ف','ا','ز','ا','ت']],['قبعة','clothes','🧢','نضعها على الرأس لحمايته من البرد',['ق','ب','ع','ة']],['ثلج','weather','❄️','بلورات بيضاء باردة تسقط من السماء',['ث','ل','ج']],['رجل الثلج','weather','☃️','نصنعه باستخدام كرات الثلج',['ر','ج','ل','ا','ل','ث','ل','ج']],['شوكولاتة','food','☕','مشروب ساخن ولذيذ يعطي دفئاً',['ش','و','ك','و','ل','ا','ت','ة']],['شاي','food','🫖','مشروب دافئ مع النعناع أو الليمون',['ش','ا','ي']],['حساء','food','🥣','طعام دافئ وم��ذٍ في الشتاء',['ح','س','ا','ء']],['تزلج','weather','⛷️','رياضة ممتعة على الثلج',['ت','ز','ل','ج']],['مطر','weather','🌧️','قطرات ماء تنزل من السحاب',['م','ط','ر']],['سحابة','weather','☁️','تتجمع في السماء وتجلب الأمطار',['س','ح','ا','ب','ة']]];
let points=+localStorage.winterPoints||0,muted=false;let app=document.querySelector('#app');const $=s=>document.querySelector(s);function speak(t){if(!muted&&speechSynthesis){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.85;speechSynthesis.speak(u)}}function tone(ok=true){if(muted)return;try{let c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=ok?650:180;o.connect(g);g.connect(c.destination);g.gain.value=.08;o.start();o.stop(c.currentTime+.16)}catch(e){}}function add(n){points+=n;localStorage.winterPoints=points;$('#score').textContent=points}function shell(title,body){$('#stats').classList.remove('hidden');$('#stats').classList.add('flex');app.innerHTML=`<section class="glass rounded-3xl p-6 md:p-8 my-6">${title}${body}</section>`}function home(){ $('#stats').classList.add('hidden');app.innerHTML=`<section class="glass rounded-3xl p-6 md:p-10 my-8 text-center border-cyan-400/30"><div class="inline-block bg-cyan-500/20 text-cyan-300 rounded-full px-4 py-2 text-sm">🎓 برنامج تعليمي للأطفال والطلاب</div><h1 class="text-3xl md:text-5xl font-black my-5">مغامرة الشتاء التعليمية ❄️</h1><div class="bg-slate-900/80 rounded-2xl p-4 border border-amber-400/40"><p class="text-amber-400 font-bold">صُنع بواسطة الفريق التعليمي:</p><b class="text-xl">يوسف ، محمد ، تاليا بيلا ، كادي</b></div><p class="text-slate-200 leading-8 my-6">تعلم كلمات الشتاء، واستمع للنطق العربي الصحيح، واختبر مهاراتك في التهجئة والمعرفة بطريقة ممتعة وتفاعلية!</p><button onclick="modes()" class="btn bg-cyan-500 px-8 py-4 rounded-2xl font-black text-xl">▶ ابدأ المغامرة الآن</button></section>`}function modes(){shell('<h2 class="text-2xl md:text-3xl text-cyan-300 font-black text-center">اختر قسم التعلم الشتوي 📚</h2><p class="text-slate-300 text-center my-2">حدد القسم الذي ترغب في استكشافه وتعلّمه اليوم</p>',`<div class="grid md:grid-cols-3 gap-4 my-6">${[['dictionary','📖','قاموس الشتاء الصوتي','تعرف على الكلمات واستمع للنطق العربي'],['spelling','🔤','تحدي التهجئة','رتّب الأحرف لتركيب الكلمات الشتوية'],['quiz','🧠','اختبار المعرفة','اختبر حصيلتك اللغوية']].map(x=>`<button onclick="${x[0]}()" class="btn glass p-6 rounded-2xl text-center"><div class="text-4xl">${x[1]}</div><h3 class="font-bold text-lg my-2">${x[2]}</h3><p class="text-xs text-slate-300">${x[3]}</p></button>`).join('')}</div><button onclick="home()" class="text-slate-400">← العودة للقائمة الرئيسية</button>`)}function dictionary(){let cat='all';function draw(){let rows=data.filter(x=>cat==='all'||x[1]===cat);shell('<div class="flex justify-between items-center"><div><h2 class="text-2xl text-cyan-300 font-bold">قاموس الشتاء الصوتي 🔊</h2><p class="text-xs text-slate-300">اضغط على أي كلمة للاستماع لنطقها ا��عربي الصحيح</p></div><button onclick="modes()" class="bg-slate-800 p-2 rounded-xl text-xs">تغيير النمط</button></div>',`<div class="flex flex-wrap justify-center gap-2 my-5">${[['all','الكل'],['clothes','الملابس'],['food','المشروبات والمأكولات'],['weather','الطقس والأنشطة']].map(x=>`<button onclick="cat='${x[0]}';draw()" class="bg-slate-800 px-3 py-2 rounded-full text-xs">${x[1]}</button>`).join('')}</div><div class="grid grid-cols-2 sm:grid-cols-3 gap-3">${rows.map(x=>`<button onclick="speak('${x[0]}');tone()" class="btn glass p-4 rounded-2xl"><div class="text-4xl">${x[2]}</div><b>${x[0]}</b><small class="block text-cyan-300">🔊 استمع</small></button>`).join('')}</div>`)}draw()}let si=0,chosen=[];function spelling(){si=0;renderSpell()}function renderSpell(){let x=data[si%6];chosen=[];shell(`<div class="flex justify-between"><span>كلمة ${si+1} من 6</span><button onclick="modes()">خروج</button></div>`,`<div class="text-center"><div class="text-7xl my-4">${x[2]}</div><p class="text-cyan-300">${x[3]}</p><button onclick="speak('${x[0]}')" class="bg-cyan-500/20 p-2 rounded-xl my-3">🔊 استمع للكلمة</button><div id="slots" class="flex justify-center gap-2 my-4"></div><div id="pool" class="flex flex-wrap justify-center gap-2"></div><p id="feedback" class="h-7 my-3"></p><button onclick="renderSpell()" class="bg-slate-800 p-2 rounded-xl">إعادة المحاولة</button></div>`);let letters=[...x[4]].sort(()=>Math.random()-.5);$('#slots').innerHTML=x[4].map(()=>'<span class="slot w-12 h-12 rounded-xl grid place-items-center">_</span>').join('');$('#pool').innerHTML=letters.map((l,i)=>`<button class="tile w-12 h-12 rounded-xl text-xl font-black" onclick="pick('${l}',this,'${x[4].join('')}')">${l}</button>`).join('')}function pick(l,b,target){let slots=[...document.querySelectorAll('#slots span')],i=slots.findIndex(s=>s.textContent==='_' );if(i<0)return;slots[i].textContent=l;slots[i].className='filled w-12 h-12 rounded-xl grid place-items-center text-xl';b.disabled=true;b.style.opacity=.3;let word=slots.map(s=>s.textContent).join('');if(!word.includes('_')){if(word===target){add(15);tone();$('#feedback').textContent='✨ ممتاز! تهجئة صحيحة (+15 نقطة)';setTimeout(()=>{si++;si<6?renderSpell():results()},700)}else{tone(false);$('#feedback').textContent='❌ حاول مرة أخرى'}}}let qi=0,streak=0;function quiz(){qi=0;streak=0;renderQuiz()}function renderQuiz(){let q=data[qi%5],opts=[q,...data.filter(x=>x[0]!==q[0]).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);shell(`<div class="flex justify-between"><span>السؤال ${qi+1} من 5</span><span>🔥 متتالي: ${streak}</span></div>`,`<div class="text-center"><div class="text-7xl my-4">${q[2]}</div><h3 class="text-xl font-bold">ما هو اسم هذا العنصر الشتوي؟</h3><div class="grid sm:grid-cols-2 gap-3 my-6">${opts.map(x=>`<button onclick="answer('${x[0]}','${q[0]}',this)" class="btn glass p-4 rounded-2xl font-bold">${x[0]}</button>`).join('')}</div><p id="qfeed" class="h-7"></p></div>`)}function answer(a,c,b){document.querySelectorAll('button').forEach(x=>x.disabled=true);if(a===c){streak++;let n=10+streak*2;add(n);tone();b.classList.add('bg-emerald-600');$('#qfeed').textContent=`✨ إجابة صحيحة! (+${n} نقطة)`}else{streak=0;tone(false);$('#qfeed').textContent=`❌ الإجابة الصحيحة هي: ${c}`}setTimeout(()=>{qi++;qi<5?renderQuiz():results()},900)}function results(){shell('<div class="text-center">','<div class="text-center"><div class="text-6xl">🏆</div><h2 class="text-3xl font-black my-3">أحسنت يا بطل!</h2><p class="text-slate-300">لقد أتممت الاختبار الشتوي بنجاح ممتاز</p><p class="text-amber-400 text-2xl font-black my-5">مجموع النقاط: '+points+'</p><button onclick="modes()" class="btn bg-cyan-500 p-3 rounded-xl w-full">اختيار نمط آخر</button><button onclick="home()" class="btn glass p-3 rounded-xl w-full mt-3">القائمة الرئيسية</button></div>');if(window.confetti)confetti({particleCount:80,spread:70})}function toggleMute(){muted=!muted;$('#mute').textContent=muted?'🔇':'🔊'}$('#score').textContent=points;home();const c=$('#snow'),ctx=c.getContext('2d');function snow(){c.width=innerWidth;c.height=innerHeight;ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#fff';for(let i=0;i<55;i++){let x=(i*97+Date.now()/30)%c.width,y=(i*53+Date.now()/12)%c.height;ctx.beginPath();ctx.arc(x,y,2,0,7);ctx.fill()}requestAnimationFrame(snow)}snow();
</script></body></html>
